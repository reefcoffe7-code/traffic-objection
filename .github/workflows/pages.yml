name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject portal corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("employee.html")
          html = path.read_text(encoding="utf-8")
          css_tag = '<link rel="stylesheet" href="./portal-fix.css?v=20260928-3">'
          js_tag = '<script src="./portal-fix.js?v=20260928-3"></script>'

          if "portal-fix.css" not in html:
              html = html.replace("</head>", f"{css_tag}</head>")
          if "portal-fix.js" not in html:
              html = html.replace("</body>", f"{js_tag}</body>")

          path.write_text(html, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
