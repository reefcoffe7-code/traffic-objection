<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الموظف — الاعتراضات</title>
<style>:root{--g:#145c4d;--bg:#f4f7f6;--line:#d7e2df;--ink:#18302b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:25px auto;padding:0 14px}.head{background:var(--g);color:#fff;padding:20px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}.login{max-width:500px;margin:40px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #bdccc8;border-radius:8px}button{border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#eaf1ef}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:220px}.item{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer}.item:hover{border-color:var(--g)}.meta{font-size:12px;color:#667873}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#eaf4f0;color:var(--g);font-size:12px}.details .row{padding:8px 0;border-bottom:1px solid #edf1f0}.details b{display:block;font-size:11px;color:#657772}.hide{display:none}.error{color:#9b2c2c;font-size:13px;margin-top:10px}.sigbox{border:1px solid #bdccc8;border-radius:10px;padding:8px;background:#fff}.sigbox canvas{width:100%;height:150px;display:block;touch-action:none}.citizen-sign{max-width:420px;border:1px solid #ddd;border-radius:8px;background:#fff;margin-top:6px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{.head,.toolbar,#list,.actions{display:none!important}.card{border:0}.wrap{margin:0}}</style></head><body><div class="wrap">
<div class="head"><div><b style="font-size:20px">لوحة الموظف — الاعتراضات</b><div style="font-size:12px">وصول خاص للموظف المصرح له</div></div><button id="logout" class="secondary hide">تسجيل الخروج</button></div>
<section id="auth" class="card login"><h2>دخول الموظف</h2><div id="setupNote" style="font-size:13px;margin-bottom:12px">إذا كانت هذه أول مرة، أنشئ حساب الموظف من نفس الشاشة.</div><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><br><br><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="12"><div style="display:flex;gap:8px;margin-top:14px"><button id="login" class="primary">دخول</button><button id="setup" class="secondary">إنشاء أول حساب</button></div><div id="authMsg" class="error"></div></section>
<section id="app" class="hide"><div class="card"><div class="toolbar"><input id="search" placeholder="بحث برقم الطلب أو المخالفة أو الاسم"><select id="filter"><option value="">كل الحالات</option><option value="new">جديد</option><option value="valid">صحيحة</option><option value="cancelled">إلغاء</option></select><button id="refresh" class="secondary">تحديث</button></div><div id="list"></div></div>
<div id="detail" class="card details hide"><h2>تفاصيل الاعتراض</h2><div id="fields"></div><div id="citizenSignWrap" style="margin-top:15px"></div><div style="margin-top:15px"><label>توقيع الموظف الإلكتروني *</label><div class="sigbox"><canvas id="employeeSig" width="700" height="200"></canvas><button type="button" id="clearEmployeeSig" class="secondary" style="margin-top:7px">مسح التوقيع</button></div></div><div class="grid" style="margin-top:15px"><div><label>الحالة</label><select id="status"><option value="new">جديد</option><option value="valid">صحيحة</option><option value="cancelled">إلغاء</option></select></div><div><label>ملاحظات الموظف</label><textarea id="notes" rows="4"></textarea></div></div><div class="actions" style="display:flex;gap:8px;margin-top:14px"><button id="save" class="primary">حفظ التحديث</button><button onclick="window.print()" class="secondary">طباعة</button></div><div id="saveMsg" style="font-size:13px;margin-top:8px"></div></div></section>
</div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://uzqlqihvgxnepmfjgxlh.supabase.co','sb_publishable_iKlB3hRgacOcBme3R6zfiw_cQtC8ib8',{auth:{persistSession:true,autoRefreshToken:true}});
const auth=document.getElementById('auth'),app=document.getElementById('app'),logout=document.getElementById('logout'),msg=document.getElementById('authMsg');let data=[],current=null,violationMap={};
function pad(id,clear){const cv=document.getElementById(id),x=cv.getContext('2d');x.lineWidth=3;x.lineCap='round';let down=false,signed=false;const p=e=>{let r=cv.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*cv.width/r.width,y:(q.clientY-r.top)*cv.height/r.height}};const a=e=>{e.preventDefault();down=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y)};const m=e=>{if(!down)return;e.preventDefault();let q=p(e);x.lineTo(q.x,q.y);x.stroke();signed=true};const z=e=>{down=false};cv.addEventListener('mousedown',a);cv.addEventListener('mousemove',m);cv.addEventListener('mouseup',z);cv.addEventListener('mouseleave',z);cv.addEventListener('touchstart',a,{passive:false});cv.addEventListener('touchmove',m,{passive:false});cv.addEventListener('touchend',z,{passive:false});document.getElementById(clear).onclick=()=>{x.clearRect(0,0,cv.width,cv.height);signed=false};return{has:()=>signed,data:()=>cv.toDataURL('image/png'),clear:()=>{x.clearRect(0,0,cv.width,cv.height);signed=false}}}const employeePad=pad('employeeSig','clearEmployeeSig');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function enter(){auth.classList.add('hide');app.classList.remove('hide');logout.classList.remove('hide');await load()}
async function load(){const {data:d,error}=await sb.from('objections').select('*').order('created_at',{ascending:false}).limit(500);if(error){document.getElementById('list').innerHTML='<div class="error">غير مصرح لهذا الحساب أو تعذر تحميل الطلبات.</div>';return}data=d||[];const ids=data.map(x=>x.id);violationMap={};if(ids.length){const {data:v}=await sb.from('objection_violations').select('*').in('objection_id',ids).order('seq');(v||[]).forEach(x=>(violationMap[x.objection_id]??=[]).push(x))}render()}
function render(){let q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value,arr=data.filter(x=>(!f||x.status===f)&&(!q||[x.reference_no,x.violation_no,x.full_name].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('list').innerHTML=arr.length?arr.map(x=>'<div class="item" data-id="'+x.id+'"><b>'+esc(x.reference_no)+'</b> — '+esc(x.full_name)+'<div class="meta">مخالفة: '+esc(x.violation_no)+' · '+new Date(x.created_at).toLocaleString('ar-SA')+' · <span class="badge">'+({new:'جديد',valid:'صحيحة',cancelled:'إلغاء'}[x.status]||x.status)+'</span></div></div>').join(''):'<div>لا توجد نتائج.</div>';document.querySelectorAll('.item').forEach(e=>e.onclick=()=>show(e.dataset.id))}
function show(id){current=data.find(x=>x.id===id);if(!current)return;const labels=[['reference_no','رقم الطلب'],['full_name','اسم المخالف'],['identity_no','رقم الهوية / الإقامة'],['nationality','الجنسية'],['plate_numbers','أرقام اللوحة'],['plate_letters','حروف اللوحة'],['vehicle_type','نوع المركبة'],['violation_no','رقم المخالفة'],['violation_date','تاريخ المخالفة'],['violation_title','مسمى المخالفة'],['violation_location','موقع المخالفة'],['objection_text','نص الاعتراض']];let base=labels.filter(([k])=>!['violation_no','violation_date','violation_title','violation_location'].includes(k)).map(([k,l])=>'<div class="row"><b>'+l+'</b>'+esc(current[k]||'—')+'</div>').join('');let vs=violationMap[current.id]||[{seq:1,violation_no:current.violation_no,violation_title:current.violation_title,violation_date:current.violation_date,violation_location:current.violation_location}];let vh=vs.map(v=>'<div class="row"><b>المخالفة '+v.seq+'</b>رقم: '+esc(v.violation_no)+'<br>النوع: '+esc(v.violation_title)+'<br>التاريخ: '+esc(v.violation_date||'—')+'<br>الموقع: '+esc(v.violation_location)+'</div>').join('');document.getElementById('fields').innerHTML=base+vh;document.getElementById('status').value=current.status;document.getElementById('notes').value=current.internal_notes||'';document.getElementById('citizenSignWrap').innerHTML=current.citizen_signature?'<label>توقيع المواطن</label><br><img class="citizen-sign" src="'+current.citizen_signature+'" alt="توقيع المواطن">':'';employeePad.clear();document.getElementById('detail').classList.remove('hide');document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
document.getElementById('login').onclick=async()=>{msg.textContent='';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='بيانات الدخول غير صحيحة.';return}await enter()};
document.getElementById('setup').onclick=async()=>{msg.textContent='جارٍ إنشاء الحساب الأول...';try{const r=await fetch('https://uzqlqihvgxnepmfjgxlh.supabase.co/functions/v1/employee-bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const o=await r.json();if(!r.ok||!o.ok){msg.textContent=o.error==='setup_closed'?'تم إنشاء حساب الموظف مسبقًا. استخدم تسجيل الدخول.':'تعذر إنشاء الحساب. استخدم بريدًا صحيحًا وكلمة مرور 12 حرفًا على الأقل.';return}msg.textContent='تم إنشاء الحساب. اضغط دخول.'}catch{msg.textContent='تعذر الاتصال.'}};
document.getElementById('save').onclick=async()=>{if(!current)return;if(!employeePad.has()){document.getElementById('saveMsg').textContent='توقيع الموظف مطلوب قبل حفظ القرار.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('objections').update({status:document.getElementById('status').value,internal_notes:document.getElementById('notes').value.slice(0,5000),employee_signature:employeePad.data(),employee_signed_at:new Date().toISOString(),employee_signed_by:user?.id||null}).eq('id',current.id);document.getElementById('saveMsg').textContent=error?'تعذر الحفظ.':'تم الحفظ.';if(!error)await load()};
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
const {data:{session}}=await sb.auth.getSession();if(session)enter();
</script></body></html>
