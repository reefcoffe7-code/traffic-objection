function renderDecision(row){let vs=violationMap[row.id]||[],nums=vs.map(v=>esc(v.violation_no)).join(' ، ');document.getElementById('decisionDoc').innerHTML='<div class="dhead">المملكة العربية السعودية<br>وزارة الداخلية — الأمن العام — الإدارة العامة للمرور<br>الهيئة المرورية بمحافظة الطائف<br><br>قرار رقم ( '+esc(row.decision_no||'—')+' )<br>تاريخ القرار: '+esc(row.decision_date||'—')+'</div><div class="legalText">استناداً إلى نظام المرور ولائحته التنفيذية، وبناءً على الصلاحيات النظامية للهيئة المرورية في النظر في الاعتراضات على المخالفات المرورية، وبعد الاطلاع على الاعتراض والمستندات والبيانات المتعلقة به.</div><div class="caseBox"><b>النظر في الاعتراض المقدم من/</b> '+esc(row.full_name)+' &nbsp;&nbsp; <b>سجل رقم/</b> '+esc(row.identity_no)+'<br><b>من المخالفات رقم/</b> '+(nums||esc(row.violation_no))+'<br><b>بعد الاطلاع على الصور وكامل المعاملة اتضح:</b><br>'+esc(row.violation_notes||'—')+'</div><div class="resultBox"><b>بناءً على ما تقدم فقد تقرر ما يلي:</b><br>'+decisionLabel(row.status)+'<br>'+esc(row.action_taken||'')+'</div><div class="signatures">والله الموفق والهادي إلى سواء السبيل، وصلى الله وسلم على نبينا محمد وعلى آله وصحبه أجمعين.<div class="sigGrid"><div>عضو<br>________________</div><div>عضو<br>________________</div><div>رئيس الهيئة المرورية المكلف<br>________________</div></div><div class="stamp">الختم</div></div>';document.getElementById('detail').classList.add('hide');document.getElementById('decisionSection').classList.remove('hide');document.getElementById('decisionSection').scrollIntoView({behavior:'smooth'})}
document.getElementById('backToForm').onclick=()=>{document.getElementById('decisionSection').classList.add('hide');document.getElementById('detail').classList.remove('hide')};
document.getElementById('save').onclick=async()=>{if(!current)return;if(!employeePad.has()){document.getElementById('saveMsg').textContent='توقيع الموظف مطلوب قبل الحفظ.';return}const action=document.querySelector('input[name="employeeAction"]:checked');if(!action){document.getElementById('saveMsg').textContent='اختر الإجراء أولاً.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('objections').update({status:action.value,action_code:action.value,violation_notes:document.getElementById('violationNotes').value.slice(0,5000),action_taken:document.getElementById('actionTaken').value.slice(0,200),employee_signature:employeePad.data(),employee_signed_at:new Date().toISOString(),employee_signed_by:user?.id||null}).eq('id',current.id);document.getElementById('saveMsg').textContent=error?'تعذر الحفظ.':'تم اعتماد القرار.';if(!error){const {data:updated}=await sb.from('objections').select('*').eq('id',current.id).single();await load();if(updated){current=updated;renderDecision(updated)}}};
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
const {data:{session}}=await sb.auth.getSession();if(session)enter();
</script></body></html>
