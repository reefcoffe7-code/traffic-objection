function pad(id,clear){const cv=document.getElementById(id),x=cv.getContext('2d');x.lineWidth=3;x.lineCap='round';let down=false,signed=false;const p=e=>{let r=cv.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*cv.width/r.width,y:(q.clientY-r.top)*cv.height/r.height}};const a=e=>{e.preventDefault();down=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y)};const m=e=>{if(!down)return;e.preventDefault();let q=p(e);x.lineTo(q.x,q.y);x.stroke();signed=true};const z=e=>{down=false};cv.addEventListener('mousedown',a);cv.addEventListener('mousemove',m);cv.addEventListener('mouseup',z);cv.addEventListener('mouseleave',z);cv.addEventListener('touchstart',a,{passive:false});cv.addEventListener('touchmove',m,{passive:false});cv.addEventListener('touchend',z,{passive:false});document.getElementById(clear).onclick=()=>{x.clearRect(0,0,cv.width,cv.height);signed=false};return{has:()=>signed,data:()=>cv.toDataURL('image/png'),clear:()=>{x.clearRect(0,0,cv.width,cv.height);signed=false}}}const employeePad=pad('employeeSig','clearEmployeeSig');

async function load(){const {data:d,error}=await sb.from('objections').select('*').order('created_at',{ascending:false}).limit(500);if(error){document.getElementById('list').innerHTML='<div class="error">غير مصرح لهذا الحساب أو تعذر تحميل الطلبات.</div>';return}data=d||[];const ids=data.map(x=>x.id);violationMap={};if(ids.length){const {data:v,error:ve}=await sb.from('objection_violations').select('*').in('objection_id',ids).order('seq',{ascending:true});if(ve){document.getElementById('list').innerHTML='<div class="error">تعذر تحميل تفاصيل المخالفات.</div>';return}(v||[]).forEach(x=>(violationMap[x.objection_id]??=[]).push(x))}render()}

function show(id){current=data.find(x=>x.id===id);if(!current)return;let vs=violationMap[current.id]||[];let rows='';for(let i=1;i<=Math.max(4,vs.length);i++){let v=vs[i-1]||{};rows+='<tr data-vid="'+(v.id||'')+'" data-seq="'+i+'"><td style="text-align:center;width:25px">'+i+'</td><td><input class="evNo" maxlength="10" value="'+esc(v.violation_no||'')+'"></td><td><input class="evTitle" value="'+esc(v.violation_title||'')+'"></td><td><input class="evDate" type="date" value="'+esc(v.violation_date||'')+'"></td><td><input class="evLoc" value="'+esc(v.violation_location||'')+'"></td></tr>'}document.getElementById('paperView').innerHTML='<div class="govHead"><div>المملكة العربية السعودية<br>وزارة الداخلية<br>الأمن العام<br>الإدارة العامة للمرور</div><div>بسم الله الرحمن الرحيم</div><div>إدارة الهيئات المرورية<br>الهيئة المرورية بمحافظة الطائف</div></div><div class="pvTitle">((المادة الخامسة والسبعون من نظام المرور))</div><div class="pvLegal">للمخالف حق الاعتراض أمام المحكمة المختصة استناداً للمادة (75) من نظام المرور الصادر بالمرسوم الملكي رقم (م / 85) وتاريخ 26 / 10 / 1428هـ ولا ينظر بالمخالفة التي مضى على تحريرها أكثر من ثلاثين يوماً.</div><table><tr><th colspan="2">مذكرة اعتراض بتاريخ</th><td colspan="2"><input id="eMemoDate" type="date" value="'+String(current.created_at||'').slice(0,10)+'"></td></tr><tr><th>الاسم</th><td><input id="eName" readonly value="'+esc(current.full_name)+'"></td><th>رقم الهوية/إقامة</th><td><input id="eId" readonly maxlength="10" value="'+esc(current.identity_no)+'"></td></tr><tr><th>الجنسية</th><td><input id="eNat" readonly value="'+esc(current.nationality)+'"></td><td colspan="2"></td></tr></table><table><tr><th style="width:25px"></th><th>رقم المخالفة</th><th>نوع المخالفة</th><th>تاريخ المخالفة</th><th>موقع المخالفة</th></tr>'+rows+'</table><div class="otherLine">☐ أخرى خلف الورقة.</div><div class="sectionTitle">بيانات المركبة</div><table><tr><th>رقم اللوحة</th><td><div style="display:flex;gap:5px;align-items:center"><input id="ePlateN" readonly value="'+esc(current.plate_numbers)+'" aria-label="أرقام اللوحة"><input id="ePlateL" readonly value="'+esc(current.plate_letters)+'" aria-label="حروف اللوحة"></div></td><th>نوع المركبة</th><td><input id="eVehicle" readonly value="'+esc(current.vehicle_type)+'"></td></tr><tr><th>رقم القرار الإلكتروني</th><td><span>'+esc(current.decision_no||'يُولد عند اعتماد القرار')+'</span></td><th>التاريخ</th><td><span>'+esc(current.decision_date||'يُسجل عند اعتماد القرار')+'</span></td></tr><tr><td colspan="4" style="text-align:center;font-weight:bold"><label><input id="eEmergency" type="checkbox" disabled style="width:auto" '+(current.emergency?'checked':'')+'> حالة إسعافية طارئة</label></td></tr><tr><th>اسم المستشفى</th><td><input id="eHospital" readonly value="'+esc(current.hospital_name||'')+'"></td><th>التاريخ</th><td><input id="eHospitalDate" readonly type="date" value="'+esc(current.hospital_date||'')+'"></td></tr><tr><th>اسم المريض</th><td><input id="ePatient" readonly value="'+esc(current.patient_name||'')+'"></td><th>رقم السجل</th><td><input id="eRecord" readonly maxlength="10" value="'+esc(current.medical_record_no||'')+'"></td></tr></table><div class="appealText"><b>سعادة رئيس الهيئة المرورية بمحافظة الطائف :</b><br>السلام عليكم ورحمة الله وبركاته : أتقدم إليكم بالاعتراض على المخالفة المذكورة بسبب:</div><textarea id="eObjection" class="reasonLines" readonly>'+esc(current.objection_text)+'</textarea><table><tr><th>الاسم:</th><td><input id="eFooterName" readonly value="'+esc(current.full_name)+'"></td><th>رقم الجوال:</th><td><input id="ePhone" readonly maxlength="10" value="'+esc(current.phone||'')+'"></td><th>التوقيع:</th><td id="citizenSigCell">'+(current.citizen_signature?'<img src="'+current.citizen_signature+'" alt="توقيع المواطن" style="max-width:110px;max-height:42px">':'')+'</td></tr></table>';document.getElementById('rationaleCode').value=current.rationale_code||'';document.getElementById('employeeRecommendationSelect').value=current.employee_recommendation||'';document.getElementById('violationNotes').value=current.violation_notes||'';document.getElementById('actionTaken').value=current.action_taken||'';employeePhotos=Array.isArray(current.evidence_photos)?current.evidence_photos:[];drawPhotos();const committeeBlock=document.getElementById('committeeDecisionBlock'),saveBtn=document.getElementById('save'),previewBtn=document.getElementById('previewCommittee'),finalBtn=document.getElementById('finalApprove');if(current.workflow_stage==='employee'){document.getElementById('employeeRecommendation').style.display='block';committeeBlock.style.display='none';saveBtn.style.display='inline-block';previewBtn.style.display='none';finalBtn.style.display='none'}else if(current.workflow_stage==='committee'){document.getElementById('employeeRecommendation').style.display='block';committeeBlock.style.display='block';saveBtn.style.display='none';previewBtn.style.display='inline-block';finalBtn.style.display='inline-block'}else{document.getElementById('employeeRecommendation').style.display='none';committeeBlock.style.display='none';saveBtn.style.display='none';previewBtn.style.display='none';finalBtn.style.display='none'}document.querySelectorAll('input[name="employeeAction"]').forEach(x=>x.checked=x.value===current.status);document.getElementById('citizenSignWrap').innerHTML='';employeePad.clear();if(current.workflow_stage==='final'){renderDecision(current)}else if(current.workflow_stage==='committee'){document.getElementById('decisionSection').classList.add('hide');document.getElementById('detail').classList.remove('hide');document.getElementById('saveMsg').innerHTML='أرسله الموظف: <b>'+esc(current.employee_display_name||'—')+'</b> — بانتظار اعتماد اللجنة';document.querySelectorAll('#detail input,#detail textarea,#detail select,#detail button').forEach(el=>{if(el.id!=='finalApprove'&&el.id!=='printForm')el.disabled=true});document.getElementById('finalApprove').disabled=false}else{document.getElementById('decisionSection').classList.add('hide');document.getElementById('detail').classList.remove('hide');document.getElementById('detail').scrollIntoView({behavior:'smooth'})}}
document.getElementById('login').onclick=async()=>{msg.textContent='';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='بيانات الدخول غير صحيحة.';return}await enter()};
document.getElementById('setup').onclick=async()=>{msg.textContent='جارٍ إنشاء الحساب الأول...';try{const r=await fetch('https://uzqlqihvgxnepmfjgxlh.supabase.co/functions/v1/employee-bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const o=await r.json();if(!r.ok||!o.ok){msg.textContent=o.error==='setup_closed'?'تم إنشاء حساب الموظف مسبقًا. استخدم تسجيل الدخول.':'تعذر إنشاء الحساب. استخدم بريدًا صحيحًا وكلمة مرور 12 حرفًا على الأقل.';return}msg.textContent='تم إنشاء الحساب. اضغط دخول.'}catch{msg.textContent='تعذر الاتصال.'}};
function decisionLabel(s,nums){if(s==='cancelled')return 'إلغاء سداد وإلغاء المخالفات رقم ('+nums+') وذلك لعدم صحتها.';if(s==='valid')return 'صحة المخالفات رقم ('+nums+') واستمرارها.';if(s==='code_edit')return 'تعديل رمز المخالفات رقم ('+nums+') وفق ما ورد في حيثيات القرار.';if(s==='transfer')return 'تحويل المعاملة لاستكمال الإجراء النظامي.';if(s==='letter')return 'إعداد خطاب بشأن المعاملة وفق ما ورد في حيثيات القرار.';return s}
function renderDecision(row){let vs=violationMap[row.id]||[],nums=vs.map(v=>esc(v.violation_no)).join(' ، ');document.getElementById('decisionDoc').innerHTML='<div style="font-size:11px;margin-bottom:4px"><b>الموظف المعد:</b> '+esc(row.employee_display_name||'—')+' &nbsp;&nbsp; <b>اعتماد اللجنة:</b> '+esc(row.committee_approved_name||'—')+'</div><div class="dhead">المملكة العربية السعودية<br>وزارة الداخلية<br>الأمن العام<br>الإدارة العامة للمرور<br><div class="decisionNo">قرار رقم ( '+esc(row.decision_no||'—')+' )</div><br>تاريخ القرار: '+esc(row.decision_date||'—')+'</div><div class="legalText">استناداً على نظام المرور بالمرسوم الملكي رقم (م / ٨٥) وتاريخ ٢٦ / ١٠ / ١٤٢٨هـ المعدل بالمرسوم الملكي رقم (م / ٧٠) وتاريخ ٦ / ١١ / ١٤٣٧هـ، وبناءً على اللائحة التنفيذية لنظام المرور والصلاحيات النظامية للهيئة المرورية في الفصل في المنازعات في القضايا والمخالفات المرورية، وبناءً على المعاملة المعروضة أمام الهيئة المرورية بمحافظة الطائف.</div><div class="caseBox"><b>النظر في الاعتراض المقدم من/</b> '+esc(row.full_name)+' &nbsp;&nbsp;&nbsp; <b>سجل رقم/</b> '+esc(row.identity_no)+'<br><b>من المخالفات رقم/</b> '+(nums||esc(row.violation_no))+'<br><b>بيان تظلمه/</b> '+esc(row.objection_text||'—')+'<br><br><b>بعد الاطلاع على الصور وكامل المعاملة اتضح/</b> '+esc(row.rationale_code||'—')+(row.violation_notes?'<br>'+esc(row.violation_notes):'')+((Array.isArray(row.evidence_photos)&&row.evidence_photos.length)?'<div style="margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px">'+row.evidence_photos.map(p=>'<img src="'+p+'" style="width:100%;max-height:150px;object-fit:contain;border:1px solid #777">').join('')+'</div>':'')+'</div><div class="resultBox"><div style="text-align:center;font-weight:bold">بناءً على ما تقدم فقد تقرر الهيئة ما يلي:</div><br>'+decisionLabel(row.status,(nums||esc(row.violation_no)))+(row.action_taken?'<br>'+esc(row.action_taken):'')+'</div><div class="signatures">والله الموفق والهادي إلى سواء السبيل، وصلى الله وسلم على نبينا محمد وعلى آله وصحبه أجمعين.<div class="sigGrid"><div><b>عضو</b><br><br>________________<br>الاسم</div><div><b>عضو</b><br><br>________________<br>الاسم</div><div><b>رئيس الهيئة المرورية المكلف</b><br><br>________________<br>الاسم</div></div><div class="stamp">الختم</div></div>';document.getElementById('detail').classList.add('hide');document.getElementById('decisionSection').classList.remove('hide');document.getElementById('decisionSection').scrollIntoView({behavior:'smooth'})}
function isolatedPrint(mode){document.body.classList.remove('print-form','print-decision');document.body.classList.add(mode);window.print();setTimeout(()=>document.body.classList.remove(mode),500)}
document.getElementById('printForm').onclick=()=>isolatedPrint('print-form');
document.getElementById('printDecision').onclick=()=>isolatedPrint('print-decision');
document.getElementById('closeDecisionPreview').onclick=()=>{document.getElementById('decisionSection').classList.add('hide');if(current&&current.workflow_stage!=='final')document.getElementById('detail').classList.remove('hide');else if(current)renderDecision(current)};
window.addEventListener('afterprint',()=>document.body.classList.remove('print-form','print-decision'));
document.getElementById('save').onclick=async()=>{if(!current||current.workflow_stage!=='employee')return;if(!employeePad.has()){document.getElementById('saveMsg').textContent='توقيع الموظف مطلوب قبل رفع الطلب للجنة.';return}const recommendation=document.getElementById('employeeRecommendationSelect').value;if(!recommendation){document.getElementById('saveMsg').textContent='اختر رأي الموظف في حالة المخالفة.';return}const rationale=document.getElementById('rationaleCode').value;if(!rationale){document.getElementById('saveMsg').textContent='اختر حيثية المخالفة.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('objections').update({employee_recommendation:recommendation,rationale_code:rationale,evidence_photos:employeePhotos,violation_notes:document.getElementById('violationNotes').value.slice(0,5000),employee_signature:employeePad.data(),employee_signed_at:new Date().toISOString(),employee_signed_by:user?.id||null,employee_display_name:employeeUserName,employee_submitted_at:new Date().toISOString(),workflow_stage:'committee'}).eq('id',current.id);document.getElementById('saveMsg').textContent=error?'تعذر رفع الطلب للجنة.':'تم رفع الطلب للجنة وقفل عمل الموظف.';if(!error)await load()};
document.getElementById('finalApprove').onclick=async()=>{if(!current||current.workflow_stage!=='committee')return;const action=document.querySelector('input[name="employeeAction"]:checked');if(!action){document.getElementById('saveMsg').textContent='على اللجنة اختيار القرار.';return}const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('objections').update({status:action.value,action_code:action.value,action_taken:document.getElementById('actionTaken').value.slice(0,200),workflow_stage:'final',committee_approved_by:user?.id||null,committee_approved_name:employeeUserName}).eq('id',current.id);if(error){document.getElementById('saveMsg').textContent='تعذر اعتماد قرار اللجنة.';return}const {data:updated}=await sb.from('objections').select('*').eq('id',current.id).single();await load();if(updated){current=updated;renderDecision(updated)}};
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=load;logout.onclick=async()=>{await sb.auth.signOut();location.reload()};
